<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSME</title>
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = '#3c0000';
        errorDiv.style.color = '#ffdddd';
        errorDiv.style.padding = '30px';
        errorDiv.style.fontFamily = 'Consolas, monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxSizing = 'border-box';
        errorDiv.style.overflow = 'auto';
        errorDiv.innerHTML = '<h1 style="color: #ff3333; margin-top: 0;">Runtime Error</h1>' +
          '<p style="font-weight: bold; font-size: 16px;">' + event.message + '</p>' +
          '<p><strong>File:</strong> ' + event.filename + ':' + event.lineno + ':' + event.colno + '</p>' +
          '<pre style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 4px;">' + (event.error ? event.error.stack : 'No stack trace available') + '</pre>';
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = '#3c0000';
        errorDiv.style.color = '#ffdddd';
        errorDiv.style.padding = '30px';
        errorDiv.style.fontFamily = 'Consolas, monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxSizing = 'border-box';
        errorDiv.style.overflow = 'auto';
        errorDiv.innerHTML = '<h1 style="color: #ff3333; margin-top: 0;">Unhandled Promise Rejection</h1>' +
          '<p style="font-weight: bold; font-size: 16px;">' + event.reason + '</p>';
        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
